<style>
/* Design: cool paper, blue-black ink, cobalt plot ink. One bold element: the measured-kernel chart in the hero.
   Project pages pair the story (left) with a sticky evidence sheet (right). */
:root {
  --paper: #f6f7f9;
  --surface: #ffffff;
  --ink: #191d27;
  --muted: #596071;
  --line: #dce0e7;
  --faint: #eceef2;
  --accent: #2440b8;
  --on-accent: #ffffff;
  --prog: #a35f00;
  --prog-soft: #fbf0df;
  --ok: #23704a;
  --ref: #9aa1b0;
  --sans: "Schibsted Grotesk", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --s-1: 0.875rem; --s0: 1rem; --s1: 1.25rem; --s2: 1.5625rem; --s3: 2rem; --s4: clamp(2.5rem, 6.2vw, 4.4rem);
  --wrap: 1120px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #11141a; --surface: #181c24; --ink: #e7eaf0; --muted: #9aa2b2; --line: #2a303c; --faint: #1e232c;
    --accent: #8ea2ff; --on-accent: #11141a; --prog: #e0a44a; --prog-soft: #2c2416; --ok: #79c99a; --ref: #5a6272;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #11141a; --surface: #181c24; --ink: #e7eaf0; --muted: #9aa2b2; --line: #2a303c; --faint: #1e232c;
  --accent: #8ea2ff; --on-accent: #11141a; --prog: #e0a44a; --prog-soft: #2c2416; --ok: #79c99a; --ref: #5a6272;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 400 var(--s0)/1.6 var(--sans); font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
[hidden] { display: none !important; }
a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 3px; }
a:hover { text-decoration-thickness: 2px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
h1, h2, h3 { margin: 0; line-height: 1.12; text-wrap: balance; letter-spacing: -0.015em; }
p { margin: 0; }
code, .code { font-family: var(--mono); font-size: 0.875em; }
.skip { position: absolute; left: -9999px; top: 8px; background: var(--surface); padding: 8px 12px; border-radius: 6px; z-index: 50; }
.skip:focus { left: 16px; }

/* top bar */
.top { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--paper) 92%, transparent); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top, 0px); }
.top-in { max-width: var(--wrap); margin: 0 auto; padding: 12px max(16px, env(safe-area-inset-right, 0px)) 12px max(16px, env(safe-area-inset-left, 0px)); display: flex; align-items: center; justify-content: space-between; gap: 8px 24px; flex-wrap: wrap; }
.name { font-weight: 800; font-size: 1.0625rem; color: var(--ink); text-decoration: none; letter-spacing: -0.01em; }
.nav { display: flex; gap: 2px; margin: 0; padding: 0; list-style: none; overflow-x: auto; scrollbar-width: none; }
.nav::-webkit-scrollbar { display: none; }
.nav a { display: block; padding: 6px 11px; border-radius: 6px; color: var(--muted); text-decoration: none; font-weight: 500; font-size: 0.9375rem; white-space: nowrap; }
.nav a:hover { color: var(--ink); background: var(--faint); }
.nav a[aria-current="page"] { color: var(--ink); background: var(--faint); }

main { max-width: var(--wrap); margin: 0 auto; padding: 48px max(16px, env(safe-area-inset-right, 0px)) 96px max(16px, env(safe-area-inset-left, 0px)); }
main:focus { outline: none; }
.view { display: grid; gap: 64px; }
.read { max-width: 68ch; }
.muted { color: var(--muted); }

/* buttons */
.actions { display: flex; flex-wrap: wrap; gap: 10px; }
.btn { display: inline-flex; align-items: center; padding: 10px 16px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); text-decoration: none; font: 600 0.9375rem/1.2 var(--sans); cursor: pointer; }
.btn:hover { border-color: var(--ink); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }

/* hero */
.hero { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 56px; align-items: center; }
.hero h1 { font-size: var(--s4); font-weight: 800; letter-spacing: -0.035em; line-height: 0.98; }
.hero-text { display: grid; gap: 22px; }
.intro { font-size: var(--s1); line-height: 1.5; max-width: 34ch; }
.facts { color: var(--muted); max-width: 46ch; }

.avail { display: inline-flex; align-items: center; gap: 10px; font-weight: 500; }
.avail::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 4px color-mix(in srgb, var(--ok) 20%, transparent); }

/* the measured-kernel chart */
.ladder { margin: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 26px 26px 22px; display: grid; gap: 20px; }
.ladder h2 { font-size: var(--s1); font-weight: 700; letter-spacing: -0.01em; }
.ladder .sub { color: var(--muted); font-size: var(--s-1); margin-top: 4px; }
.rungs { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; position: relative; }
.rung { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; align-items: baseline; }
.rung .who { font-weight: 600; font-size: 0.9375rem; }
.rung .who span { font-weight: 400; color: var(--muted); }
.rung .val { font-weight: 700; font-size: 0.9375rem; text-align: right; }
.rung .val small { font-weight: 400; color: var(--muted); font-size: 0.8125rem; margin-right: 10px; }
.track { grid-column: 1 / -1; height: 14px; border-radius: 3px; background: repeating-linear-gradient(90deg, var(--faint) 0 calc(10% - 1px), var(--line) calc(10% - 1px) 10%); position: relative; overflow: hidden; }
.fill { position: absolute; inset: 0 auto 0 0; width: var(--w); background: var(--accent); border-radius: 3px; }
.rung.base .fill { background: color-mix(in srgb, var(--accent) 45%, var(--ref)); }
.rung.ref .fill { background: var(--ref); }
.ladder .foot { color: var(--muted); font-size: 0.8125rem; line-height: 1.5; border-top: 1px solid var(--line); padding-top: 14px; }
.ladder .foot a { color: var(--muted); }
@media (prefers-reduced-motion: no-preference) {
  .grow .fill { animation: grow 0.9s cubic-bezier(.2,.7,.2,1) both; animation-delay: calc(var(--i) * 0.12s + 0.15s); }
  @keyframes grow { from { width: 0; } }
}

/* section heads */
.head { display: grid; gap: 10px; }
.head h2 { font-size: var(--s3); font-weight: 800; letter-spacing: -0.025em; }
.head p { color: var(--muted); max-width: 64ch; }
.head h1 { font-size: clamp(2.2rem, 5vw, 3.2rem); font-weight: 800; letter-spacing: -0.03em; }

/* overview: three areas */
.areas { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; border-top: 2px solid var(--ink); }
.area { padding: 22px 24px 8px 0; display: grid; gap: 14px; align-content: start; }
.area + .area { padding-left: 24px; border-left: 1px solid var(--line); }
.area h3 { font-size: var(--s1); font-weight: 700; }
.area > p { color: var(--muted); font-size: 0.9375rem; }
.plist { list-style: none; margin: 0; padding: 0; display: grid; }
.plist a { display: grid; grid-template-columns: 10px minmax(0, 1fr); gap: 2px 12px; align-items: baseline; padding: 10px 0; border-top: 1px solid var(--line); text-decoration: none; color: var(--ink); }
.plist a:hover b { color: var(--accent); }
.plist b { font-weight: 600; }
.plist span.d { grid-column: 2; color: var(--muted); font-size: var(--s-1); line-height: 1.4; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); align-self: center; transform: translateY(-1px); }
.dot.prog { background: var(--prog); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; color: var(--muted); font-size: var(--s-1); }
.legend span { display: inline-flex; align-items: center; gap: 8px; }

/* projects index */
.filters { display: flex; flex-wrap: wrap; gap: 0; border: 1px solid var(--line); border-radius: 9px; padding: 3px; width: max-content; max-width: 100%; background: var(--surface); }
.filters button { font: 500 0.9375rem var(--sans); padding: 7px 14px; border-radius: 6px; border: 0; background: transparent; color: var(--muted); cursor: pointer; }
.filters button:hover { color: var(--ink); }
.filters button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.rows { display: grid; border-top: 1px solid var(--line); }
.row { display: grid; grid-template-columns: minmax(0, 280px) minmax(0, 1fr); gap: 6px 32px; padding: 22px 0; border-bottom: 1px solid var(--line); text-decoration: none; color: var(--ink); }
.row:hover h3 { color: var(--accent); }
.row h3 { font-size: var(--s1); font-weight: 700; }
.row .rsub { color: var(--muted); font-size: 0.9375rem; margin-top: 4px; }
.row .rbody { display: grid; gap: 10px; align-content: start; }
.row .rbody p { max-width: 64ch; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 20px; color: var(--muted); font-size: var(--s-1); }
.status { display: inline-flex; align-items: center; gap: 7px; font-weight: 500; color: var(--ok); }
.status.prog { color: var(--prog); }
.status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }

/* project detail */
.crumbs { font-size: 0.9375rem; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; }
.crumbs a { color: var(--muted); }
.dhead { display: grid; gap: 18px; max-width: 72ch; }
.dhead h1 { font-size: clamp(2.2rem, 5vw, 3.4rem); font-weight: 800; letter-spacing: -0.03em; }
.dhead .lede { font-size: var(--s1); line-height: 1.5; }
.dgrid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 400px); gap: 56px; align-items: start; }
.story { display: grid; gap: 44px; }
.story section { display: grid; gap: 14px; }
.story h2, .sheet h2 { font-size: var(--s2); font-weight: 700; }
.story p, .story li { max-width: 66ch; }
.story ul { margin: 0; padding-left: 1.15em; display: grid; gap: 8px; }
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; counter-reset: s; }
.steps li { display: inline-flex; align-items: center; font-size: 0.9375rem; counter-increment: s; }
.steps li span { padding: 7px 12px 7px 9px; background: var(--surface); border: 1px solid var(--line); border-radius: 7px; display: inline-flex; gap: 8px; align-items: baseline; }
.steps li span::before { content: counter(s); font-size: 0.75rem; font-weight: 700; color: var(--accent); }
.stack { color: var(--muted); }
.sheet { position: sticky; top: 84px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 22px; display: grid; gap: 16px; }
.source { display: grid; gap: 2px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
.source span { color: var(--muted); font-size: var(--s-1); }
.source b { font-weight: 600; }
.kv { display: grid; margin: 0; }
.kv div { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 16px; padding: 10px 0; border-bottom: 1px solid var(--faint); align-items: baseline; }
.kv div:last-child { border-bottom: 0; }
.kv dt { color: var(--muted); font-size: 0.9375rem; }
.kv dd { margin: 0; font-weight: 600; text-align: right; max-width: 22ch; }
.caveat { background: var(--prog-soft); border-radius: 9px; padding: 12px 14px; font-size: 0.9375rem; line-height: 1.55; }
.caveat b { color: var(--prog); }
.sheet .actions .btn { flex: 1 1 auto; justify-content: center; }
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; border-top: 1px solid var(--line); padding-top: 20px; }
.pager a { display: grid; gap: 2px; text-decoration: none; color: var(--ink); }
.pager a span { color: var(--muted); font-size: var(--s-1); }
.pager a b { font-size: var(--s1); }
.pager a:hover b { color: var(--accent); }
.pager a:last-child { text-align: right; }

.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; padding: 12px 16px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }

.papers { display: grid; border-top: 1px solid var(--line); }
.papers a { display: grid; gap: 4px; padding: 18px 0; border-bottom: 1px solid var(--line); text-decoration: none; color: var(--ink); }
.papers a b { font-weight: 600; font-size: 1.0625rem; line-height: 1.4; max-width: 70ch; }
.papers a:hover b { color: var(--accent); }
.papers span { color: var(--muted); font-size: var(--s-1); }
.timeline { display: grid; border-top: 2px solid var(--ink); }
.tl { display: grid; grid-template-columns: 160px minmax(0, 1fr); gap: 6px 32px; padding: 24px 0; border-bottom: 1px solid var(--line); }
.tl .when { color: var(--muted); font-weight: 500; padding-top: 2px; }
.tl h3 { font-size: var(--s1); font-weight: 700; }
.tl .org { color: var(--muted); margin: 4px 0 10px; }
.tl ul { margin: 0; padding-left: 1.1em; display: grid; gap: 6px; max-width: 70ch; }
.docs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.doc { display: grid; gap: 10px; align-content: start; padding: 22px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.doc h3 { font-size: var(--s1); font-weight: 700; }
.doc p { color: var(--muted); }
.doc .btn { justify-self: start; margin-top: 6px; }
.contact { display: grid; gap: 16px; }
.addr { font-size: clamp(1.4rem, 4vw, 2.2rem); font-weight: 700; letter-spacing: -0.02em; word-break: break-all; }
.toast { color: var(--ok); min-height: 1.5em; font-size: var(--s-1); }

footer { border-top: 1px solid var(--line); }
.foot-in { max-width: var(--wrap); margin: 0 auto; padding: 22px max(16px, env(safe-area-inset-right, 0px)) calc(28px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-wrap: wrap; gap: 8px 24px; color: var(--muted); font-size: var(--s-1); }

@media (max-width: 960px) {
  .hero { grid-template-columns: minmax(0, 1fr); gap: 36px; }

@media (max-width: 640px) {

}

<script>

const TRACKS = {
  systems: { name: "Systems and compilers", short: "Systems", blurb: "Compilers, GPU kernels and the tooling that tunes them. C++, CUDA, MLIR." },

const PROJECTS = [
  { slug: "ptxforge", track: "systems", title: "PTXForge", sub: "GPU kernel compiler and autotuner in C++20",
    status: "prog", data: "Measured on a Tesla T4", stack: ["C++20", "MLIR / LLVM 19", "TableGen", "CUDA Driver API"],
    links: [["Code", GH + "ptxforge"]],
    lede: "A closed-loop autotuner for a fused GEMM + bias + GELU CUDA kernel, with custom MLIR passes for epilogue fusion and shared-memory padding. On a T4 it reaches 85.6% of cuBLAS.",
    problem: "Choosing tile sizes and shared-memory layout for a GPU kernel by hand is slow, and a wrong guess can cost several times in throughput. PTXForge searches the configuration space with a cost model, measures every candidate on the GPU, and keeps a trace of each decision.",
    pipe: ["linalg", "fuse-epilogue", "tile (transform schedule)", "bufferize", "pad-workgroup-memory", "gpu → nvvm → llvm", "PTX", "CUDA runner"],
    how: [

    results: [["Best config, 2048³ FP32", "3,688.5 GFLOP/s"], ["Untuned default", "2,074.0 GFLOP/s"], ["Gain from tuning", "1.78×"], ["Share of cuBLAS, same run", "85.6%"], ["Cost model vs measured rank", "ρ = −0.67"], ["Search space", "3,610 configs"], ["C++ unit tests", "16, clean under ASan + UBSan"]],

  { slug: "minic", track: "systems", title: "minic", sub: "A compiler in C++17",

function ladder() {
  const rungs = LADDER.map((r, i) => {
    const pct = r.gf ? (100 * r.gf / r.ref) : 100;
    const label = r.slug ? `<a href="#p-${r.slug}">${esc(r.who)}</a>` : esc(r.who);
    const val = r.gf ? `<small>${fmt(r.gf)} GFLOP/s</small>${pct.toFixed(1)}%` : `100%`;
    return `<li class="rung ${r.cls}" style="--i:${i}">
      <span class="who">${label} <span>${esc(r.note)}</span></span>
      <span class="val">${val}</span>
      <span class="track" aria-hidden="true"><span class="fill" style="--w:${pct.toFixed(2)}%"></span></span>
    </li>`;
  }).join("");
  return `<figure class="ladder${firstRender ? " grow" : ""}" aria-labelledby="ladder-title">
    <div><h2 id="ladder-title">My matrix-multiply kernels on a Tesla T4</h2>
    <p class="sub">Throughput as a share of cuBLAS, N = 2048, FP32</p></div>

      <div><h3>${esc(p.title)}</h3><p class="rsub">${esc(p.sub)}</p></div>
      <div class="rbody"><p>${esc(p.lede)}</p>
        <div class="meta">${statusText(p)}<span>${esc(p.data)}</span><span>${esc(p.stack.join(", "))}</span></div></div>
    </a>`).join("");
  return `
  <div class="head"><h1>Projects</h1><p>Every project links to its code, and each page says what its numbers come from and what hasn't been verified yet.</p></div>
  <div style="display:grid;gap:20px">
    <div class="filters" role="group" aria-label="Filter projects">${btn("all", "All")}${Object.entries(TRACKS).map(([k, t]) => btn(k, t.short)).join("")}</div>
    <div class="rows">${rows}</div>
  </div>`;
}

function detail(p) {
  const i = PROJECTS.indexOf(p), prev = PROJECTS[(i - 1 + PROJECTS.length) % PROJECTS.length], next = PROJECTS[(i + 1) % PROJECTS.length];
  const links = p.links.map(([t, h], j) => ext(h, t, j === 0 ? "btn primary" : "btn")).join("");
  const kv = p.results.map(([a, b]) => `<div><dt>${esc(a)}</dt><dd>${esc(b)}</dd></div>`).join("");
  return `
  <nav class="crumbs" aria-label="Breadcrumb"><a href="#work">Projects</a><span aria-hidden="true">/</span><span>${esc(TRACKS[p.track].name)}</span></nav>
  <header class="dhead">
    <h1>${esc(p.title)}</h1>
    <p class="lede">${esc(p.lede)}</p>
    <div class="meta">${statusText(p)}${p.patent ? `<span>Patent: ${esc(p.patent)}</span>` : ""}</div>
  </header>
  <div class="dgrid">
    <div class="story">
      <section><h2>The problem</h2><p>${esc(p.problem)}</p></section>
      <section><h2>How it works</h2>
        <ol class="steps" aria-label="Pipeline">${p.pipe.map(s => `<li><span>${esc(s)}</span></li>`).join("")}</ol>
        <ul>${p.how.map(h => `<li>${esc(h)}</li>`).join("")}</ul>
      </section>
      <section><h2>Built with</h2><p class="stack">${esc(p.stack.join(", "))}</p></section>
    </div>
    <aside class="sheet" aria-labelledby="ev-${p.slug}">
      <h2 id="ev-${p.slug}">Evidence</h2>
      <div class="source"><span>Numbers come from</span><b>${esc(p.data)}</b></div>
      <dl class="kv">${kv}</dl>
      ${p.caveat ? `<p class="caveat"><b>Before you quote these:</b> ${esc(p.caveat)}</p>` : ""}
      <div class="actions">${links}</div>
    </aside>
  </div>
  <nav class="pager" aria-label="More projects"><a href="#p-${prev.slug}"><span>Previous</span><b>${esc(prev.title)}</b></a><a href="#p-${next.slug}"><span>Next</span><b>${esc(next.title)}</b></a></nav>`;
}

function research() {
  const prow = ([t, s, n, slug]) => `<tr><td><a href="#p-${slug}">${esc(t)}</a></td><td>${s === "Published" ? `<span class="status">Published</span>` : `<span class="status prog">Filed</span>`}</td><td class="n">${esc(n || "Not yet assigned")}</td></tr>`;
  return `
  <div class="head"><h1>Research and patents</h1><p>Six patent applications filed through the VIT IPR Cell, five published. Each one has a working prototype or study on GitHub.</p></div>
  <section class="view" style="gap:18px"><h2 style="font-size:var(--s2)">Patents</h2>
    <div class="tablewrap"><table><thead><tr><th scope="col">Title</th><th scope="col">Status</th><th scope="col">Application no.</th></tr></thead><tbody>${PATENTS.map(prow).join("")}</tbody></table></div>
  </section>
  <section class="view" style="gap:18px"><h2 style="font-size:var(--s2)">Manuscripts submitted to IEEE Access</h2>
    <p class="muted read">Each one ships with open code, data and a one-command reproducible run.</p>
    <div class="papers">${PAPERS.map(([t, slug]) => `<a href="#p-${slug}"><b>${esc(t)}</b><span>Code and data: ${esc(bySlug[slug].title)}</span></a>`).join("")}</div>
  </section>`;
}

  return `

function resumes() {
  const doc = (t, d, f) => `<div class="doc"><h3>${esc(t)}</h3><p>${esc(d)}</p><a class="btn" href="resume/${f}" target="_blank" rel="noopener">Open PDF</a></div>`;
  return `
  <div class="head"><h1>Résumés</h1><p>One page each, with the same facts and a different emphasis for each kind of role.</p></div>
  <div class="docs">
    ${doc("Software engineering", "Java and backend: the bug-repair agent, the booking backend, the LSM-tree store and the compiler.", "Rakshit_Ratan_Pathak_Resume_SDE.pdf")}
    ${doc("AI and ML engineering", "The RAG internship work and five ML projects with measured, multi-seed results.", "Rakshit_Ratan_Pathak_Resume_AI_ML.pdf")}

function contact() {
  return `

    <span class="addr" id="addr">rrpathak.0007@gmail.com</span>

    <div class="toast" id="toast" role="status"></div>
  </div>`;

function nav(active) {
  document.getElementById("nav").innerHTML = SECTIONS.map(([h, t]) =>
    `<li><a href="#${h}"${h === active ? ' aria-current="page"' : ""}>${esc(t)}</a></li>`).join("");
}

function render() {
  const h = decodeURIComponent(location.hash.slice(1));
  const view = document.getElementById("view");
  let html, active = "", title = "Rakshit Ratan Pathak";
  if (h.startsWith("p-") && bySlug[h.slice(2)]) { const p = bySlug[h.slice(2)]; active = "work"; html = detail(p); title = p.title + ", Rakshit Ratan Pathak"; }
  else if (h === "work") { active = "work"; html = work(); title = "Projects, Rakshit Ratan Pathak"; }
  else if (h === "research") { active = h; html = research(); title = "Research, Rakshit Ratan Pathak"; }
  else if (h === "experience") { active = h; html = experience(); title = "Experience, Rakshit Ratan Pathak"; }
  else if (h === "resumes") { active = h; html = resumes(); title = "Résumés, Rakshit Ratan Pathak"; }
  else if (h === "contact") { active = h; html = contact(); title = "Contact, Rakshit Ratan Pathak"; }
  else html = overview();
  view.innerHTML = html;
  document.title = title;
  nav(active);
  if (!firstRender && !keepScroll && h && h !== "top") { window.scrollTo(0, 0); document.getElementById("main").focus({ preventScroll: true }); }
  if (!h || h === "top") window.scrollTo(0, 0);
  firstRender = false;
  keepScroll = false;
}

document.addEventListener("click", e => {
  const f = e.target.closest("[data-filter]");
  if (f) { workFilter = f.dataset.filter; keepScroll = true; render(); document.querySelector(`[data-filter="${workFilter}"]`)?.focus(); return; }
  if (e.target.id === "copy") {
    const t = document.getElementById("toast"), addr = document.getElementById("addr");
    const done = () => { t.textContent = "Address copied."; };
    const fallback = () => { const r = document.createRange(); r.selectNodeContents(addr); const s = getSelection(); s.removeAllRanges(); s.addRange(r); t.textContent = "Address selected. Press Ctrl+C or ⌘C to copy it."; };
    try { navigator.clipboard.writeText(addr.textContent).then(done, fallback); } catch (_) { fallback(); }
  }
});
window.addEventListener("hashchange", render);
render();
</script>
