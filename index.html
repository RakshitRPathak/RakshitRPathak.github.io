<style>
/* Layout: persistent left rail of "layers" (overview → section → detail) beside a reading column; stacks to a top bar on phones. */
:root {
  --bg: #f1f3f0;          /* cool sage-grey paper */
  --surface: #ffffff;
  --ink: #17201d;
  --muted: #59655f;
  --line: #d5dbd6;
  --accent: #0d6b6b;      /* oxidised teal */
  --accent-soft: #dceeec;
  --warn: #8a5a10;        /* in-progress status */
  --warn-soft: #f6ead3;
  --ok: #2c6b3a;
  --ok-soft: #e0efe2;
  --code-bg: #e7ebe7;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --step--1: 0.8125rem; --step-0: 1rem; --step-1: 1.1875rem; --step-2: 1.5rem; --step-3: 2.125rem; --step-4: clamp(2.4rem, 5vw, 3.6rem);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101614; --surface: #16201d; --ink: #e4ebe7; --muted: #9aa8a1; --line: #2a3632;
    --accent: #5cc4b8; --accent-soft: #173431; --warn: #e2b062; --warn-soft: #33281a;
    --ok: #8ccf98; --ok-soft: #1b2e20; --code-bg: #1c2724; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101614; --surface: #16201d; --ink: #e4ebe7; --muted: #9aa8a1; --line: #2a3632;
  --accent: #5cc4b8; --accent-soft: #173431; --warn: #e2b062; --warn-soft: #33281a;
  --ok: #8ccf98; --ok-soft: #1b2e20; --code-bg: #1c2724; color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 var(--step-0)/1.6 var(--body); -webkit-font-smoothing: antialiased; }
[hidden] { display: none !important; }
img { max-width: 100%; }
a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 3px; }
a:hover { text-decoration-thickness: 2px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
h1, h2, h3 { font-family: var(--display); line-height: 1.12; text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
p { margin: 0; }
code, .mono { font-family: var(--mono); font-size: 0.9em; }
.label { font: 500 var(--step--1)/1.3 var(--mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }

.shell { display: grid; grid-template-columns: 250px minmax(0, 1fr); min-height: 100vh; }
.rail { position: sticky; top: 0; height: 100vh; overflow-y: auto; border-right: 1px solid var(--line); padding: 28px 22px; display: flex; flex-direction: column; gap: 28px; }
.brand { display: grid; gap: 4px; text-decoration: none; color: var(--ink); }
.brand b { font: 800 1.35rem/1.1 var(--display); }
.brand span { color: var(--muted); font-size: var(--step--1); }
.layers { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.layers a { display: grid; grid-template-columns: 2.2em 1fr; align-items: baseline; padding: 7px 10px; border-radius: 6px; color: var(--ink); text-decoration: none; font-weight: 500; }
.layers a .k { font: 400 var(--step--1) var(--mono); color: var(--muted); }
.layers a:hover { background: var(--code-bg); }
.layers a[aria-current="true"] { background: var(--accent-soft); color: var(--accent); }
.layers a[aria-current="true"] .k { color: var(--accent); }
.sub { list-style: none; margin: 2px 0 6px 2.2em; padding: 0 0 0 10px; border-left: 1px solid var(--line); display: grid; }
.sub a { display: block; padding: 4px 8px; font-size: var(--step--1); color: var(--muted); text-decoration: none; border-radius: 4px; }
.sub a:hover { color: var(--ink); }
.sub a[aria-current="true"] { color: var(--accent); font-weight: 600; }
.rail-foot { margin-top: auto; display: grid; gap: 6px; font-size: var(--step--1); color: var(--muted); }
.rail-foot a { color: var(--muted); }

main { min-width: 0; padding-block: 36px 80px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.col { max-width: 860px; margin: 0 auto; padding-inline: clamp(0px, 3vw, 28px); display: grid; gap: 40px; }
.path { font: 400 var(--step--1) var(--mono); color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.path a { color: var(--muted); text-decoration: none; }
.path a:hover { color: var(--accent); }
.path .sep { opacity: 0.6; }

/* overview */
.hero { display: grid; gap: 18px; }
.hero h1 { font-size: var(--step-4); font-weight: 800; }
.hero .lede { font-size: var(--step-1); max-width: 62ch; color: var(--ink); }
.facts { display: flex; flex-wrap: wrap; gap: 10px 28px; padding-top: 6px; }
.facts div { display: grid; }
.facts b { font: 700 var(--step-2)/1.1 var(--display); font-variant-numeric: tabular-nums; }
.facts span { font-size: var(--step--1); color: var(--muted); }
.cta { display: flex; flex-wrap: wrap; gap: 10px; }
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 9px 16px; border-radius: 7px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); text-decoration: none; font: 500 var(--step--1)/1.2 var(--body); cursor: pointer; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--bg); }
.btn.primary:hover { filter: brightness(1.08); color: var(--bg); }

.stack { display: grid; gap: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); }
.band { display: grid; grid-template-columns: minmax(0, 220px) minmax(0, 1fr); gap: 18px; padding: 20px 22px; border-top: 1px solid var(--line); }
.band:first-child { border-top: 0; }
.band h3 { font-size: var(--step-1); }
.band p { color: var(--muted); font-size: var(--step--1); margin-top: 4px; }
.band .depth { font: 400 var(--step--1) var(--mono); color: var(--accent); margin-bottom: 6px; display: block; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; align-content: start; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px; border-radius: 999px; background: var(--code-bg); color: var(--ink); text-decoration: none; font-size: var(--step--1); font-weight: 500; border: 1px solid transparent; }
.chip:hover { border-color: var(--accent); color: var(--accent); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); flex: none; }
.dot.prog { background: var(--warn); }

.section-head { display: grid; gap: 8px; }
.section-head h2 { font-size: var(--step-3); }
.section-head p { color: var(--muted); max-width: 62ch; }

/* work index */
.filters { display: flex; flex-wrap: wrap; gap: 8px; }
.filters button { font: 500 var(--step--1) var(--body); padding: 6px 13px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--ink); cursor: pointer; }
.filters button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.rows { display: grid; border-top: 1px solid var(--line); }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 20px; padding: 18px 4px; border-bottom: 1px solid var(--line); text-decoration: none; color: var(--ink); }
.row:hover h3 { color: var(--accent); }
.row h3 { font-size: var(--step-1); font-weight: 700; }
.row p { color: var(--muted); font-size: 0.95rem; grid-column: 1 / -1; max-width: 70ch; }
.row .meta { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px 14px; font: 400 var(--step--1) var(--mono); color: var(--muted); }
.pill { display: inline-flex; align-items: center; gap: 6px; font: 500 0.75rem/1 var(--mono); letter-spacing: 0.04em; text-transform: uppercase; padding: 5px 9px; border-radius: 5px; background: var(--ok-soft); color: var(--ok); white-space: nowrap; align-self: start; }
.pill.prog { background: var(--warn-soft); color: var(--warn); }
.pill.data { background: var(--code-bg); color: var(--muted); }

/* detail */
.detail-head { display: grid; gap: 14px; }
.detail-head h1 { font-size: var(--step-3); font-weight: 800; }
.detail-head .lede { font-size: var(--step-1); max-width: 62ch; }
.pills { display: flex; flex-wrap: wrap; gap: 8px; }
.links { display: flex; flex-wrap: wrap; gap: 10px; }
.block { display: grid; gap: 12px; }
.block h2 { font-size: var(--step-2); }
.block p, .block li { max-width: 68ch; }
.block ul { margin: 0; padding-left: 1.2em; display: grid; gap: 6px; }
.pipe { overflow-x: auto; background: var(--code-bg); border-radius: 8px; padding: 16px 18px; }
.pipe ol { list-style: none; margin: 0; padding: 0; display: flex; gap: 0; align-items: stretch; width: max-content; }
.pipe li { display: flex; align-items: center; font: 500 var(--step--1) var(--mono); }
.pipe li span { padding: 7px 11px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; white-space: nowrap; }
.pipe li + li::before { content: "→"; padding: 0 8px; color: var(--accent); }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 0.95rem; }
th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
th { font: 500 var(--step--1) var(--mono); letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); background: var(--code-bg); }
td.num { font-variant-numeric: tabular-nums; font-family: var(--mono); font-size: 0.9rem; white-space: nowrap; }
.note { border-left: 3px solid var(--warn); background: var(--warn-soft); padding: 12px 16px; border-radius: 0 8px 8px 0; color: var(--ink); max-width: 72ch; }
.note b { color: var(--warn); }
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; border-top: 1px solid var(--line); padding-top: 20px; }
.pager a { display: grid; gap: 2px; text-decoration: none; color: var(--ink); padding: 10px 0; }
.pager a:last-child { text-align: right; }
.pager a b { font-family: var(--display); font-size: var(--step-1); }
.pager a:hover b { color: var(--accent); }

/* lists elsewhere */
.timeline { display: grid; gap: 0; border-top: 1px solid var(--line); }
.tl { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 6px 24px; padding: 20px 0; border-bottom: 1px solid var(--line); }
.tl .when { font: 400 var(--step--1) var(--mono); color: var(--muted); padding-top: 4px; }
.tl h3 { font-size: var(--step-1); }
.tl .org { color: var(--muted); font-size: var(--step--1); margin: 2px 0 8px; }
.tl ul { margin: 0; padding-left: 1.1em; display: grid; gap: 5px; }
.cards3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px; }
.doc { display: grid; gap: 8px; align-content: start; padding: 18px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.doc h3 { font-size: var(--step-1); }
.doc p { color: var(--muted); font-size: 0.95rem; }
.contact { display: grid; gap: 10px; }
.contact .line { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.contact .addr { font: 500 var(--step-1) var(--mono); user-select: all; }
.toast { font-size: var(--step--1); color: var(--ok); min-height: 1.4em; }

@media (max-width: 860px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .rail { position: sticky; top: env(safe-area-inset-top, 0px); height: auto; z-index: 5; background: var(--bg); border-right: 0; border-bottom: 1px solid var(--line); padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); flex-direction: row; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
  .brand span, .rail-foot, .sub, .layers a .k { display: none; }
  .layers { display: flex; flex-wrap: wrap; gap: 2px; }
  .layers a { display: block; padding: 5px 9px; font-size: var(--step--1); }
  .band { grid-template-columns: minmax(0, 1fr); }
  .tl { grid-template-columns: minmax(0, 1fr); }
  td.num { white-space: normal; }
  main { padding-block: 24px 64px; }
}
@media (prefers-reduced-motion: no-preference) {
  .view { animation: rise 0.28s ease-out both; }
  @keyframes rise { from { transform: translateY(6px); } to { transform: none; } }
}

<script>
const GH = "https://github.com/RakshitRPathak/";
const TRACKS = {
  systems: { name: "Systems and compilers", depth: "C++ · CUDA · MLIR", blurb: "Compilers, GPU kernels and the tooling that tunes them." },
  ml:      { name: "ML systems and research", depth: "Python · conformal · RAG", blurb: "Models judged by multi-seed results, with code and data released." },

// status: "done" or "prog"; data: what the numbers come from
const PROJECTS = [
  { slug: "ptxforge", track: "systems", title: "PTXForge", sub: "GPU kernel autotuner and MLIR passes in C++20",
    status: "prog", data: "No GPU results yet", stack: ["C++20", "MLIR / LLVM 19", "TableGen", "CUDA Driver API"],
    links: [],
    lede: "A closed-loop autotuner for a fused GEMM + bias + GELU CUDA kernel, with custom MLIR passes for epilogue fusion and shared-memory padding.",
    problem: "Choosing tile sizes and shared-memory layout for a GPU kernel by hand is slow, and a wrong guess can cost several times in throughput. PTXForge searches the configuration space with a cost model, measures candidates, and keeps a trace of every decision.",
    pipe: ["linalg", "fuse-epilogue", "tile (transform schedule)", "bufferize", "pad-workgroup-memory", "gpu → nvvm → llvm", "PTX", "CUDA runner"],
    how: [
      "Header-only C++20 core: a 3,610-config tile search space, a roofline cost model (arithmetic intensity, register caps, occupancy, wave quantization) and closed-loop search.",
      "One bank-conflict model is shared by the tuner and the MLIR padding pass, so the compiler and the cost model agree on what conflict-free means.",
      "Advisors (none, random, rules, knowledge graph, external LLM) propose configs; every suggestion is validated in C++ before it runs.",
      "The CUDA runner loads PTX in-process through the Driver API and checks results against an fp64 reference before it times anything."
    ],
    results: [["Search space (2048³ on a T4)", "3,610 configs"], ["Unit tests", "16, clean under ASan + UBSan"], ["Transposed tile store, no padding", "8-way bank conflict"], ["Same store, 1 float of padding", "4-way"], ["Same store, 4 floats of padding", "conflict-free"], ["C++ vs Python reference cost model", "identical on every config, 4 GPUs × 3 sizes"]],
    caveat: "The MLIR passes and the CUDA runner are written but not yet compiled against LLVM or run on a GPU. There are no GFLOP/s numbers here on purpose; they come after the first run on a real GPU." },

  { slug: "minic", track: "systems", title: "minic", sub: "A compiler in C++17",
    status: "done", data: "Deterministic tests", stack: ["C++17", "CMake", "ASan / UBSan"],
    links: [["Code", GH + "minic"]],
    lede: "A dependency-free compiler for a small imperative language, going through the same stages as a production compiler.",
    problem: "Built to understand every stage between source text and execution, including the parts textbooks skip: error messages with line numbers, forward jumps, and keeping optimizations from changing behaviour.",
    pipe: ["source", "lexer", "parser (AST)", "semantic analysis", "optimizer", "bytecode + backpatching", "stack VM"],
    how: [
      "Hand-written lexer with one character of lookahead; recursive-descent parser building an AST.",
      "Constant folding and dead-branch and dead-loop elimination. Folding shares its arithmetic code with the VM, so both agree on overflow and division.",
      "Forward jumps are resolved by backpatching, the same problem linkers solve with relocations.",
      "Semantic analysis runs before optimization, so removing dead code can never change which programs compile."
    ],
    results: [["Size", "1,200+ lines, no dependencies"], ["Automated tests", "43 (12 check exact error messages)"], ["Optimized vs unoptimized output", "identical on all 14 test programs"], ["Sanitizers", "clean under ASan + UBSan"]],
    caveat: "" },

  { slug: "cuda-gpu-bench", track: "systems", title: "cuda-gpu-bench", sub: "CUDA kernels and analysis",
    status: "prog", data: "No GPU results yet", stack: ["CUDA", "C++", "PTX", "ThreadSanitizer"],
    links: [["Code", GH + "cuda-gpu-bench"]],
    lede: "Hand-written CUDA kernels for vector add, matrix multiply and sum reduction, with a CPU emulator that tests kernel logic without a GPU.",
    problem: "Each kernel answers one question a GPU performance engineer asks: how much does shared-memory tiling help, and what does synchronization cost (atomics vs shared-memory tree vs warp shuffles)?",
    pipe: ["kernel source", "CPU emulator tests", "clang → PTX", "nvcc build", "CUDA-event timing", "CPU reference check"],
    how: [

  { slug: "opinion-lineage", track: "ml", title: "Opinion Lineage System", sub: "Self-correcting sentiment and lineage-aware RAG",

    links: [["Paper code", GH + "OpinionLineage-OLS"], ["RAG system", GH + "Opinion-lineage-system"]],
    lede: "Estimates organic sentiment from streams full of reposts, paraphrases, coordinated copies and AI rewrites, and corrects published estimates when provenance changes.",

  { slug: "railconflict-pscl", track: "ml", title: "RailConflict-PSCL", sub: "Railway collision-risk assessment",

    caveat: "Results come from a simulated railway network, not field data.", patent: "Filed (railway collision avoidance)" },

    const cur = h === active;
    let sub = "";
    if (h === "work" && active === "work") {
      sub = `<ul class="sub">${PROJECTS.map(p => `<li><a href="#p-${p.slug}" aria-current="${p.slug === slug}">${esc(p.title)}</a></li>`).join("")}</ul>`;
    }
    return `<li><a href="#${h || "top"}" aria-current="${cur}"><span class="k">${k}</span><span>${esc(t)}</span></a>${sub}</li>`;
  }).join("");
  document.getElementById("layers").innerHTML = items;
}

function render() {
  const h = decodeURIComponent(location.hash.slice(1));
  const view = document.getElementById("view");
  let html, active = "", slug = null, title = "Rakshit Ratan Pathak";
  if (h.startsWith("p-") && bySlug[h.slice(2)]) { const p = bySlug[h.slice(2)]; slug = p.slug; active = "work"; html = detail(p); title = p.title + " · Rakshit Ratan Pathak"; }
  else if (h === "work") { active = "work"; html = work(); title = "Work · Rakshit Ratan Pathak"; }
  else if (h === "research") { active = h; html = research(); }
  else if (h === "experience") { active = h; html = experience(); }
  else if (h === "resumes") { active = h; html = resumes(); }
  else if (h === "contact") { active = h; html = contact(); }
  else html = overview();
  view.innerHTML = html;
  view.classList.remove("view"); void view.offsetWidth; view.classList.add("view");
  document.title = title;
  nav(active, slug);
  if (h && h !== "top") { window.scrollTo(0, 0); document.getElementById("main").focus({ preventScroll: true }); }
}

document.addEventListener("click", e => {
  const f = e.target.closest("[data-filter]");
  if (f) { workFilter = f.dataset.filter; render(); return; }
  if (e.target.id === "copy") {
    const t = document.getElementById("toast"), addr = document.getElementById("addr");
    const done = () => { t.textContent = "Copied to clipboard."; };
    const fallback = () => { const r = document.createRange(); r.selectNodeContents(addr); const s = getSelection(); s.removeAllRanges(); s.addRange(r); t.textContent = "Selected. Press Ctrl+C or ⌘C to copy."; };
    try { navigator.clipboard.writeText(addr.textContent).then(done, fallback); } catch (_) { fallback(); }
  }
});
window.addEventListener("hashchange", render);
render();
</script>
</body>
